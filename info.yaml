# ============================================================================
# PROJECT NAME TOKEN — if you rename this project later, find-and-replace this
# EXACT string in every file listed in this repo (info.yaml, docs/info.md,
# README.md, gds/ filenames, top_module below, and the GitHub repo name
# itself). The name must stay identical everywhere: repo name, top_module,
# and final GDS/LEF filenames.
#
#   PROJECT_NAME = tt_um_catalinlazar_ringamp_bgap_ihp
#
# ============================================================================

project:
  wokwi_id: 0                  # not used for custom-GDS/analog projects
  title:        "SG13G2 Analog Primitives: Comparator, Ring-Amp OTA & Dual Bandgap"
  author:       "Catalin Lazar"
  discord:      ""             # optional, add your Discord username
  description: >
    A library of seven reusable ihp-sg13cmos5l analog primitives, all
    targeting a ~1.0V supply, on a single 1x2 analog tile: a StrongARM/
    double-tail dynamic comparator; three alternative low-voltage residue-
    amplifier architectures - a ring-amplifier OTA, a Floating
    Inverter Amplifier (FIA), and a Zero-Crossing-Based discharge amplifier
    (ZCBC); a classic folded-cascode/telescopic OTA as a proven backup for
    the eventual cyclic-ADC residue amplifier; a CMOS 1.2V-class voltage
    reference using a Banba-style current-summed (not series-stacked)
    architecture to reach ~1.0V (NPN unavailable / PNP uncharacterized on
    this CMOS-only PDK variant, so this is subthreshold-CMOS, not a
    bipolar bandgap); and a switched-capacitor ("end-of-life" style)
    bandgap. All mux-arbitrated blocks (everything except the comparator,
    which bypasses the mux) share ua_out through a 3-bit digitally
    controlled mux and a single shared output buffer, with a mode-select
    for raw/unbuffered debug access. Submitted as Chipalooza Round 1 IP,
    and as Phase 1 toward a future cyclic-ADC proposal - this round
    doubles as a bake-off between three modern residue-amplifier
    candidates plus a conventional fallback for that eventual ADC.
  language:     "Analog"       # custom full-custom analog, not synthesized HDL
  clock_hz:     0               # no fixed digital clock; comparator clock is
                                 # provided externally via a digital pin (see pinout)

  # --- Analog / custom-GDS specific fields ---
  tiles:        "1x2"           # analog projects must be 1x2 or 2x2
  analog_pins:  3                # ua[0], ua[1], ua[2] — shared mux bus
                                  # (confirm exact field name/schema against the
                                  #  live ttsky-analog-template info.yaml — TT's
                                  #  schema has changed between shuttle versions)
  uses_3v3:     false            # set true only if you need the 3.3V pad variant

  top_module:   "tt_um_catalinlazar_ringamp_bgap_ihp"

  source_files:
    - "src/behavioral/comparator_beh.va"
    - "src/behavioral/ringamp_ota_beh.va"
    - "src/behavioral/cmos_vref_beh.va"
    - "src/behavioral/sc_bandgap_beh.va"
    - "src/behavioral/zcbc_amp_beh.va"
    - "src/behavioral/fia_ota_beh.va"
    - "src/behavioral/classic_ota_beh.va"
    - "src/behavioral/buffer_beh.va"
    - "src/behavioral/tt_um_catalinlazar_ringamp_bgap_ihp_beh.va"
    # add xschem/ schematics and spice/ testbenches here as they're created;
    # the final submission needs the GDS/LEF in gds/, not these behavioral
    # files — this list is for documentation/simulation reference

# ----------------------------------------------------------------------------
# Digital pins — all currently reserved/unused (mux select + status only).
# Do NOT leave digital outputs floating: tie unused uo_out/uio_out/uio_oe to 0.
# ----------------------------------------------------------------------------
pinout:
  # Inputs — used as analog-mux block-select and comparator clock
  ui[0]: "mux_sel[0] - block select bit 0, see mapping table in docs/info.md"
  ui[1]: "mux_sel[1] - block select bit 1"
  ui[2]: "comparator_clk - clock for comparator, ZCBC amp, and SC bandgap"
  ui[3]: "buf_bypass - 1: shared output buffer's input = ua_in directly (buffer-only characterization, same buffer instance as normal path)"
  ui[4]: "ua_raw_sel - 1: ua[1] = bare mux output, bypassing the buffer entirely (debug mode, same pin as normal buffered output - not a second pad)"
  ui[5]: "mux_sel[2] - block select bit 2 (sel[2:0] = {ui[5], ui[1], ui[0]})"
  ui[6]: ""
  ui[7]: ""

  # Outputs — digitized status / comparator digital output
  uo[0]: "comparator_out - digital output of Block 1 when selected"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional — unused for now, all set as inputs (high-Z outputs)
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

  # Analog pins — shared bus, block selected by mux_sel[1:0]
  ua[0]: "analog_in  - shared analog input/stimulus to the selected block, or to the buffer directly when buf_bypass=1"
  ua[1]: "analog_out - buffer output (normal, ua_raw_sel=0) or bare mux output (debug, ua_raw_sel=1) - never both at once, same pad"
  ua[2]: "analog_ref - shared second input/reference (comparator ref, bandgap sense)"
